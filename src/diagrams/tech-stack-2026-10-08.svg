  <a href="https://www.getdbt.com" target="_blank" rel="noopener">
    <title>SQL-based transformation tool that lets analytics engineers build, test and document data models in version control. Runs as its own layer on top of the warehouse.</title>
    <rect x="462" y="375" width="178" height="64" rx="4" fill="#ffffff" stroke="#0a0a0f" stroke-width="1.2"/>
    <image href="/logos/dbt.png" x="486" y="386" width="130" height="24" preserveAspectRatio="xMidYMid meet"/>
