  </a>
  <a href="https://debezium.io" target="_blank" rel="noopener">
    <title>Open-source CDC platform that streams database changes in real time for event-driven data pipelines.</title>
    <rect x="220" y="242" width="178" height="64" rx="4" fill="#ffffff" stroke="#0a0a0f" stroke-width="1.2"/>
    <image href="/logos/debezium.png" x="244" y="253" width="130" height="24" preserveAspectRatio="xMidYMid meet"/>
