  <a href="https://airbyte.com" target="_blank" rel="noopener">
    <title>Open-source data integration platform for syncing data from APIs, databases and files.</title>
    <rect x="210" y="86" width="160" height="62" rx="4" fill="#ffffff" stroke="#0a0a0f" stroke-width="1.2"/>
