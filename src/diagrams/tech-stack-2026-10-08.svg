  <a href="https://cloud.google.com/bigquery" target="_blank" rel="noopener">
    <title>Google's serverless, scalable cloud data warehouse built for fast SQL analytics at any scale.</title>
    <rect x="462" y="90" width="178" height="64" rx="4" fill="#ffffff" stroke="#0a0a0f" stroke-width="1.2"/>
    <image href="/logos/bigquery.png" x="486" y="101" width="130" height="24" preserveAspectRatio="xMidYMid meet"/>
