  <a href="https://airbyte.com" target="_blank" rel="noopener">
    <title>Open-source data integration platform for syncing data from APIs, databases and files.</title>
    <rect x="220" y="90" width="178" height="64" rx="4" fill="#ffffff" stroke="#0a0a0f" stroke-width="1.2"/>
    <image href="/logos/airbyte.svg" x="244" y="101" width="130" height="24" preserveAspectRatio="xMidYMid meet"/>
    <text x="309" y="142" text-anchor="middle" font-family="'Outfit', system-ui, sans-serif" font-size="12" fill="#3d3b38">open-source connectors</text>
  </a>
  <a href="https://hevodata.com" target="_blank" rel="noopener">
    <title>No-code pipeline platform for extracting and syncing data from 150+ sources into your warehouse.</title>
    <rect x="220" y="166" width="178" height="64" rx="4" fill="#ffffff" stroke="#0a0a0f" stroke-width="1.2"/>
