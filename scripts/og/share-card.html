<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Outfit'; font-weight: 400 900; src: url('../../public/fonts/outfit-latin.woff2') format('woff2'); }
  @font-face { font-family: 'DM Mono'; font-weight: 500; src: url('../../public/fonts/dm-mono-500-latin.woff2') format('woff2'); }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #0a0a0f; color: #f5f3f0; font-family: 'Outfit', sans-serif; position: relative; overflow: hidden; }
  .grid { position: absolute; inset: 0; opacity: 0.05; }
  .v { position: absolute; top: 0; bottom: 0; width: 1px; background: #8aaaff; }
  .h { position: absolute; left: 0; right: 0; height: 1px; background: #8aaaff; }
  .logo { position: absolute; top: 56px; left: 72px; width: 120px; height: 120px; }
  .title { position: absolute; left: 72px; top: 236px; font-weight: 900; font-size: 92px; line-height: 0.98; letter-spacing: -0.03em; }
  .title span { color: #8aaaff; }
  .sub { position: absolute; left: 72px; top: 456px; font-size: 30px; line-height: 1.35; color: #f5f3f0; max-width: 900px; opacity: 0.85; }
  .url { position: absolute; left: 72px; bottom: 44px; font-family: 'DM Mono', monospace; font-weight: 500; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; color: #8aaaff; }
</style></head>
<body>
  <div class="grid">
    <div class="v" style="left:20%"></div><div class="v" style="left:40%"></div><div class="v" style="left:60%"></div><div class="v" style="left:80%"></div>
    <div class="h" style="top:25%"></div><div class="h" style="top:50%"></div><div class="h" style="top:75%"></div>
  </div>
  <img class="logo" src="../../public/maxq-analytics-logo.png" alt="">
  <div class="title">Agentic Analytics<br><span>On all your data</span></div>
  <div class="sub">One source of truth for your entire business, from raw data to company-wide agentic workflows.</div>
  <div class="url">www.maxqanalytics.io</div>
</body></html>
